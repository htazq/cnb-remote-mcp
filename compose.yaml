# Local / 本地：docker compose up -d --build
# Tunnel / 隧道：docker compose -f compose.yaml -f compose.cloudflare.yaml up -d --build
services:
  cnb-remote-mcp:
    build: .
    image: cnb-remote-mcp:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      CNB_TOKEN: ${CNB_TOKEN:?Set CNB_TOKEN in .env}
      CNB_API_BASE_URL: ${CNB_API_BASE_URL:-https://api.cnb.cool}
      CNB_WEB_BASE_URL: ${CNB_WEB_BASE_URL:-https://cnb.cool}
      MCP_ACCESS_TOKENS: ${MCP_ACCESS_TOKENS:?Set MCP_ACCESS_TOKENS in .env}
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3000"
      MCP_PUBLIC_BASE_URL: ${MCP_PUBLIC_BASE_URL:-}
      MCP_WRITE_MODE: ${MCP_WRITE_MODE:-read-only}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_OAUTH_REDIRECT_URIS: ${MCP_OAUTH_REDIRECT_URIS:-}
      MCP_GIT_TIMEOUT_SECONDS: ${MCP_GIT_TIMEOUT_SECONDS:-180}
      MCP_GIT_MAX_WORKSPACES: ${MCP_GIT_MAX_WORKSPACES:-20}
      MCP_DATA_DIR: /app/data
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
